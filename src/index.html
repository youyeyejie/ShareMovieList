<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https://api.themoviedb.org https://api.github.com https://raw.githubusercontent.com; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#fffef0"><meta name="description" content="一起收藏想看的电影和剧集，看过后收进「一起看过」。"><title>等空一起看</title><link rel="icon" href="./assets/cinema-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./config.js"></script><script type="module" src="./app.js"></script></head>
<body>
<a class="skip-link" href="#wall">跳到观影清单</a>
<header><a class="brand" href="./"><img class="brand-mark" src="./assets/cinema-mark.svg" alt=""><span>等空一起看<small>SHARE MOVIE LIST</small></span></a><nav><a class="tmdb-credit" href="https://www.themoviedb.org/" aria-label="TMDB" target="_blank" rel="noopener noreferrer"><img class="tmdb-logo" src="./assets/tmdb.svg" alt="TMDB"></a><a id="repo-link" target="_blank" rel="noopener noreferrer">GitHub ↗</a><span class="account-status"><span class="live-dot"></span><span id="connection">正在加载片单</span></span><button id="settings-button" class="icon-button settings-trigger" aria-label="设置"><span aria-hidden="true">⚙</span><span>连接设置</span></button></nav></header>
<main><p id="notice" class="notice" role="status" hidden></p><div class="board-frame"><section class="toolbar" aria-label="清单工具"><div class="tabs" role="group" aria-label="作品类型"><button class="active" aria-pressed="true" data-filter="all">全部 <span id="total-count">0</span></button><button aria-pressed="false" data-filter="movie">电影</button><button aria-pressed="false" data-filter="anime">番剧</button><button aria-pressed="false" data-filter="tv">剧集</button><button aria-pressed="false" data-filter="other">其他</button></div><details id="list-picker"><summary id="list-select" aria-label="选择观影清单">选择清单</summary><div class="list-popup"><div id="list-options"></div><button type="button" id="new-list">＋ 创建清单</button></div></details><div class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="找一个故事…" aria-label="搜索清单"></label><button id="refresh" type="button" class="secondary" aria-label="刷新清单" title="刷新清单">↻</button><button id="add-button" class="primary">＋ 添加作品</button></div></section>
<section id="wall" tabindex="0" class="wall" aria-label="片单墙" aria-live="polite"></section></div>
</main>
<button id="album-button" class="album-button"><span class="album-art" aria-hidden="true">▤</span><span>一起看过<small id="album-count">0 个共同的片刻 ↗</small></span></button>
<dialog id="editor" aria-labelledby="editor-title"><form id="movie-form"><div class="dialog-heading"><div><h2 id="editor-title">添加作品</h2></div><button type="button" class="close" data-close aria-label="关闭">×</button></div><div class="title-lookup"><label>片名<input name="title" maxlength="160" placeholder="未命名作品"></label><button type="button" class="secondary" id="lookup">查询 TMDB</button><button type="button" id="extension-draft" class="secondary">从扩展读取</button></div>
<div id="lookup-results" aria-live="polite"></div><div class="editor-grid">
<label>类型<select name="type"><option value="movie">电影</option><option value="anime">番剧</option><option value="tv">剧集</option><option value="other">其他</option></select></label><label>年份<input name="year" maxlength="4" pattern="[0-9]{4}"></label>
<label>评分<input name="rating" type="number" min="0" max="10" step="0.1"></label>
<label>评分来源<input name="ratingSource" maxlength="40"></label>
<label class="long-field">作品链接<input name="url" type="url"></label>
<label>封面地址<input name="cover" type="url"></label>
<div class="cover-upload"><span>上传封面</span><div class="cover-choice"><button type="button" class="secondary" id="pick-cover" aria-label="上传封面，选择图片">选择图片</button><span id="cover-name" role="status"></span></div><input id="cover-file" hidden type="file" accept="image/jpeg,image/png,image/webp"></div>
<span id="cover-status" class="long-field" role="status"></span>
<label class="long-field">简介<textarea name="overview" rows="4" maxlength="5000"></textarea></label><label class="long-field">备注<textarea name="note" maxlength="500" rows="1"></textarea></label></div><button type="submit" class="primary full">添加到片单墙</button></form></dialog>
<dialog id="settings" aria-labelledby="settings-title"><form id="settings-form"><div class="dialog-heading"><h2 id="settings-title">连接设置</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><p id="auth-status"></p><label>GitHub 个人访问令牌<input name="token" type="password" autocomplete="off" placeholder="保存在此浏览器，断开连接时清除"></label>

<label>TMDB 长令牌<input name="tmdbToken" type="password" autocomplete="off" placeholder="保存在此浏览器，清空后保存即可移除"></label><div class="auth-actions"><button class="primary">验证 GitHub 身份</button><button type="button" class="secondary" id="logout">断开连接</button><button type="button" id="save-tmdb" class="primary">保存 TMDB 设置</button></div>
</form></dialog>
<dialog id="new-list-dialog" aria-label="创建清单"><form id="new-list-form"><label>新清单名称<input name="newList" required maxlength="80"></label><div class="settings-actions"><button class="primary">开始添加作品</button><button type="button" class="secondary" data-close>取消</button></div></form></dialog><dialog id="detail" aria-label="作品详情"><div id="detail-content"></div></dialog><dialog id="album" aria-labelledby="album-title"><div class="dialog-heading"><div><p class="eyebrow">OUR COLLECTED MOMENTS</p><h2 id="album-title">一起看过</h2></div><button class="close" data-close aria-label="关闭">×</button></div><div class="album-toolbar"><label class="search album-search"><span aria-hidden="true">⌕</span><input id="album-search" type="search" placeholder="在相册里找一个故事…" aria-label="搜索一起看过的作品"></label><span id="album-results" role="status" aria-live="polite"></span></div><div id="album-grid"></div><nav class="album-pagination" aria-label="相册分页"><button id="album-prev" class="secondary" aria-label="相册上一页">← 上一页</button><span id="album-page" aria-live="polite"></span><button id="album-next" class="secondary" aria-label="相册下一页">下一页 →</button></nav></dialog>
<dialog id="message-dialog" aria-labelledby="message-title" aria-describedby="message-body"><div class="dialog-heading"><h2 id="message-title"></h2><button type="button" id="message-close" class="close" aria-label="关闭提示">×</button></div><p id="message-body"></p><div class="message-actions"><button type="button" id="message-cancel" class="secondary">取消</button><button type="button" id="message-confirm" class="primary">确定</button></div></dialog>
<dialog id="share-output" aria-label="复制共享链接"><div class="dialog-heading"><h2>复制共享链接</h2><button class="close" data-close aria-label="关闭">×</button></div><p class="hint">浏览器未允许自动复制。请手动复制下面的链接。</p><label>共享链接<textarea id="share-url" readonly rows="5"></textarea></label></dialog><div id="toast" role="status" hidden></div>
</body></html>
