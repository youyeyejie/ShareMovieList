<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://image.tmdb.org data:; connect-src https://api.themoviedb.org; base-uri 'self'; form-action 'self'"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#fffef0"><meta name="description" content="把想一起看的故事，挂在这里。一个共享的观影摄影室。"><title>片刻放映室 · Shared Cinema</title><link rel="icon" href="./assets/cinema-mark.svg" type="image/svg+xml"><link rel="stylesheet" href="./src/style.css"><script src="./config.js"></script><script type="module" src="./src/app.js"></script></head>
<body>
<a class="skip-link" href="#wall">跳到观影清单</a>
<header><a class="brand" href="./"><img class="brand-mark" src="./assets/cinema-mark.svg" alt=""><span>片刻放映室<small>THE SHARED CINEMA</small></span></a><nav><span class="live-dot"></span><span id="connection">正在打开摄影室</span><button id="settings-button" class="icon-button settings-trigger" aria-label="设置"><span aria-hidden="true">⚙</span><span>连接设置</span></button><a id="tmdb-link" hidden target="_blank" rel="noopener noreferrer">TMDB ↗</a></nav></header>
<main><section class="toolbar" aria-label="清单工具"><div class="tabs" role="group" aria-label="作品类型"><button class="active" aria-pressed="true" data-filter="all">全部 <span id="total-count">0</span></button><button aria-pressed="false" data-filter="movie">电影</button><button aria-pressed="false" data-filter="anime">番剧</button><button aria-pressed="false" data-filter="tv">剧集</button><button aria-pressed="false" data-filter="other">其他</button></div><div class="tools"><label class="search"><span>⌕</span><input id="search" type="search" placeholder="找一个故事…" aria-label="搜索清单"></label><button id="refresh" class="icon-button" title="刷新清单" aria-label="刷新清单">↻</button><button id="add-button" class="primary">＋ 添加作品</button></div></section>
<div class="wall-caption"><h1>我们的观影墙</h1><span id="wall-count">待放映 / 00</span></div><p id="notice" class="notice" role="status" hidden></p><section id="wall" class="wall" aria-label="待观看照片墙" aria-live="polite"></section>
<footer><span>在忙碌的日子里，留一点时间给电影。</span><span><a class="tmdb-credit" href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer"><img class="tmdb-logo" src="./assets/tmdb.svg" alt="TMDB"></a></span></footer></main>
<button id="album-button" class="album-button"><span class="album-art" aria-hidden="true">▤</span><span>我们的已看相册<small id="album-count">0 个共同的片刻 ↗</small></span></button>
<dialog id="editor" aria-labelledby="editor-title"><form id="movie-form"><div class="dialog-heading"><div><p class="eyebrow">A NEW STORY</p><h2 id="editor-title">添加作品</h2></div><button type="button" class="close" data-close aria-label="关闭">×</button></div><div id="search-fields"><label>搜索 TMDB 作品<input id="lookup-query" placeholder="输入电影、剧集或番剧名称" maxlength="120" autocomplete="off"></label><button type="button" id="lookup" class="secondary">搜索 TMDB</button></div><div id="lookup-results" aria-live="polite"></div><div id="selected-movie"></div><label>类型<select name="type"><option value="movie">电影</option><option value="anime">番剧</option><option value="tv">剧集</option><option value="other">其他</option></select></label><label>留一句话<textarea name="note" maxlength="500" rows="3" placeholder="为什么想一起看这部？"></textarea></label><p id="save-hint" class="hint"></p><button type="submit" class="primary full">添加到照片墙</button></form></dialog>
<dialog id="settings" aria-labelledby="settings-title"><form id="settings-form"><div class="dialog-heading"><h2 id="settings-title">连接设置</h2><button type="button" class="close" data-close aria-label="关闭">×</button></div><label>TMDB 长令牌<input name="readToken" type="password" autocomplete="off" placeholder="API Read Access Token"></label><label>清单 ID<input name="listId" inputmode="numeric" pattern="[1-9][0-9]*" placeholder="创建或选择清单后自动填写"></label><button class="primary full">保存并加载</button><div class="settings-section"><h3>账号 <span id="auth-status"></span></h3><div class="settings-actions"><button type="button" id="login" class="secondary">登录 TMDB</button><button type="button" id="finish-login" class="secondary" hidden>完成授权</button><button type="button" id="logout" class="secondary" hidden>断开连接</button><button type="button" id="revoke" class="secondary danger" hidden>撤销授权</button></div></div><div class="settings-section"><h3>清单</h3><div class="settings-actions"><button type="button" id="my-lists" class="secondary">选择清单</button><button type="button" id="create-list" class="secondary">创建清单</button></div><div id="my-list-results" aria-live="polite"></div></div><div class="settings-section"><h3>分享</h3><div class="settings-actions"><button type="button" id="share" class="secondary">共享编辑链接</button><button type="button" id="share-readonly" class="secondary">只读链接</button></div></div><button type="button" id="settings-help" class="help-link">使用说明与权限 ↗</button></form></dialog>
<dialog id="detail" aria-label="作品详情"><div id="detail-content"></div></dialog><dialog id="album" aria-labelledby="album-title"><div class="dialog-heading"><div><p class="eyebrow">OUR COLLECTED MOMENTS</p><h2 id="album-title">一起看过的故事</h2></div><button class="close" data-close aria-label="关闭">×</button></div><div class="album-toolbar"><label class="search album-search"><span aria-hidden="true">⌕</span><input id="album-search" type="search" placeholder="在相册里找一个故事…" aria-label="搜索已看相册"></label><span id="album-results" role="status" aria-live="polite"></span></div><div id="album-grid"></div><nav class="album-pagination" aria-label="相册分页"><button id="album-prev" class="secondary" aria-label="相册上一页">← 上一页</button><span id="album-page" aria-live="polite"></span><button id="album-next" class="secondary" aria-label="相册下一页">下一页 →</button></nav></dialog>
<dialog id="message-dialog" aria-labelledby="message-title" aria-describedby="message-body"><div class="dialog-heading"><h2 id="message-title"></h2><button type="button" id="message-close" class="close" aria-label="关闭提示">×</button></div><p id="message-body"></p><div class="message-actions"><button type="button" id="message-cancel" class="secondary">取消</button><button type="button" id="message-confirm" class="primary">确定</button></div></dialog>
<dialog id="share-output" aria-label="复制共享链接"><div class="dialog-heading"><h2>复制共享链接</h2><button class="close" data-close aria-label="关闭">×</button></div><p class="hint">浏览器未允许自动复制。请手动复制下面的链接。</p><label>共享链接<textarea id="share-url" readonly rows="5"></textarea></label></dialog><div id="toast" role="status" hidden></div>
</body></html>
