name: Movie metadata
run-name: metadata-${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      mode:
        required: true
        type: choice
        options: [search, detail, douban]
      query:
        required: true
        type: string
permissions:
  contents: read
  checks: write
jobs:
  lookup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node scripts/metadata.mjs
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ inputs.request_id }}
          MODE: ${{ inputs.mode }}
          QUERY: ${{ inputs.query }}
