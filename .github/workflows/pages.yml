name: Deploy cinema to Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '!src/scripts/**'
      - 'extension/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
      - name: Package browser extension
        run: |
          mkdir -p downloads
          cd extension
          zip -qr ../downloads/douban-import.zip manifest.json popup.html popup.js bridge.js worker.js icons
      - name: Assemble public website
        run: |
          mkdir _site
          cp src/*.js src/index.html src/style.css _site/
          cp -r src/assets downloads _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
