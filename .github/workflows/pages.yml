name: Deploy cinema to Pages
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'style.css'
      - 'assets/**'
      - 'extension/**'
      - 'scripts/discussions.mjs'
      - '.github/workflows/pages.yml'
  discussion:
    types: [created, edited, deleted, category_changed]
  workflow_dispatch:
permissions:
  contents: read
  discussions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'discussion' || github.event.discussion.category.name == 'Movies' || github.event.discussion.category.name == 'Movie Lists'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Export public watchlists
        run: node scripts/discussions.mjs export
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v5
      - name: Package browser extension
        run: |
          mkdir -p downloads
          cd extension
          zip -q ../downloads/douban-import.zip manifest.json popup.html popup.js bridge.js worker.js
      - name: Assemble public website
        run: |
          mkdir _site
          cp *.js index.html style.css watchlists.json _site/
          cp -r assets downloads _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
