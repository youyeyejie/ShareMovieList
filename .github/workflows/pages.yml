name: Deploy cinema to Pages
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'extension/**'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
      - name: Package browser extension
        run: |
          mkdir -p src/downloads
          cd extension
          zip -q ../src/downloads/douban-import.zip manifest.json popup.html popup.js bridge.js worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
